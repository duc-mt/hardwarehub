[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hardwarehub"
version = "0.1.0"
description = "Management of hardwarehub, with various stocks stored in the database"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    { name = "Mai Tan Duc", email = "ducmai.network@gmail.com" }
]
dependencies = [
    "icontract==2.7.3",
    "rich==14.3.4"
]

[tool.setuptools]
py-modules = ["main", "authenticator"]
packages = ["exceptions"]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "pytest-cov==6.0.0",
    "ruff==0.9.6",
    "mypy==1.9.0",
    "bandit==1.8.3",
    "pip-audit==2.7.3",
    "pre-commit==3.7.0"
]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    "__pycache__"
]

[tool.ruff.lint]
select = ["E", "F", "B", "SIM", "UP", "I"]
ignore = []

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true
show_error_codes = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "--cov=. --cov-report=xml --cov-report=term-missing"
testpaths = [
    "tests",
]
