[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hardwarehub"
version = "0.1.0"
description = "Management of hardwarehub, with various stocks stored in the database"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    { name = "Mai Tan Duc", email = "ducmai.network@gmail.com" }
]
dependencies = [
    "icontract>=2.6.0",
    "rich>=13.0.0"
]

[tool.setuptools]
py-modules = ["main", "authenticator"]
packages = ["exceptions"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
    "mypy>=1.9.0",
    "bandit>=1.7.0",
    "pip-audit>=2.7.0",
    "pre-commit>=3.7.0"
]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [".agents", 
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    "__pycache__"
]

[tool.ruff.lint]
select = ["E", "F", "B", "SIM", "UP", "I"]
ignore = []

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true
show_error_codes = true
exclude = [".agents", 
    "^build/",
    "^\\.venv/",
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "--cov=. --cov-report=xml --cov-report=term-missing"
testpaths = [
    "tests",
]
